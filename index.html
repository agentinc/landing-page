<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_white.svg" id="favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f5" />
    <meta name="description" content="Agentinc is the managed cloud platform and marketplace for deploying, managing, and scaling AI agents." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agentinc | Run any AI agent. Rewrite nothing." />
    <meta property="og:description" content="Bring agents built with any SDK. Deploy, manage, and scale them through one cloud platform." />
    <meta property="og:url" content="https://withagentinc.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Agentinc | Run any AI agent. Rewrite nothing." />
    <meta name="twitter:description" content="The managed cloud platform and marketplace for AI agents." />
    <link rel="canonical" href="https://withagentinc.com/" />
    <title>Agentinc | Run any AI agent. Rewrite nothing.</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme-storage')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.classList.toggle('light', !dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          document.getElementById('favicon').href = dark ? '/logo_white.svg' : '/logo_black.svg'
          document.querySelector('meta[name="theme-color"]').content = dark ? '#101411' : '#f5f7f5'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
