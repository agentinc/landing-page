<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_white.svg" id="favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101411" />
    <meta name="description" content="Agentinc is the managed cloud platform and marketplace for deploying, managing, and scaling AI agents." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agentinc | Run any AI agent. Rewrite nothing." />
    <meta property="og:description" content="Bring agents built with any SDK. Deploy, manage, and scale them through one cloud platform." />
    <meta property="og:url" content="https://withagentinc.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Agentinc | Run any AI agent. Rewrite nothing." />
    <meta name="twitter:description" content="The managed cloud platform and marketplace for AI agents." />
    <link rel="canonical" href="https://withagentinc.com/" />
    <title>Agentinc | Run any AI agent. Rewrite nothing.</title>
    <script>
      // Set favicon based on browser's color scheme preference
      (function() {
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const favicon = document.getElementById('favicon');
        if (favicon) {
          favicon.href = isDark ? '/logo_white.svg' : '/logo_black.svg';
        }

        // Listen for changes in browser theme
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          const favicon = document.getElementById('favicon');
          if (favicon) {
            favicon.href = e.matches ? '/logo_white.svg' : '/logo_black.svg';
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
