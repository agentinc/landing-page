<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafbfb" />
    <meta name="description" content="Agentinc is the managed cloud platform and marketplace for deploying, managing, and scaling AI agents." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agentinc | Your agents. One managed cloud." />
    <meta property="og:description" content="Deploy, manage, and scale every AI agent from one secure cloud platform." />
    <meta property="og:url" content="https://withagentinc.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Agentinc | Your agents. One managed cloud." />
    <meta name="twitter:description" content="Deploy, manage, and scale every AI agent from one secure cloud platform." />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://withagentinc.com/" />
    <title>Agentinc | Your agents. One managed cloud.</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme-storage')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          var accent = localStorage.getItem('accent-storage')
          root.dataset.accent = accent || 'blue'
          root.classList.toggle('dark', dark)
          root.classList.toggle('light', !dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').content = dark ? '#101114' : '#fafbfb'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
